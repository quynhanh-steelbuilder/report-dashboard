<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard KPI – Demo</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Cấu hình môi trường của gói giao diện này. Giao diện từ chối dữ liệu có moi_truong khác.
    window.APP_CONFIG = { moi_truong: 'demo', ten_moi_truong: 'DEMO', provider: 'mock' };
  </script>
</head>
<body>
  <a class="skip" href="#main">Bỏ qua điều hướng</a>
  <div class="env-banner" role="note"><b id="env-name">DEMO</b> · Toàn bộ công ty, phòng ban, KPI và số liệu là GIẢ LẬP · Màu trạng thái gán theo kịch bản minh hoạ · Biểu đồ vẽ tạm bằng SVG</div>
  <header class="topbar">
    <button type="button" id="nav-toggle" class="icon-btn" aria-label="Mở điều hướng" aria-expanded="false" aria-controls="sidebar">☰</button>
    <div class="brand"><span class="logo" aria-hidden="true">◧</span><div><b>Báo cáo quản trị</b><small>Công ty Giả lập Alpha</small></div></div>
    <div class="controls">
      <label>Kỳ báo cáo<select id="sel-ky" class="sel"></select></label>
      <label>So sánh với<select id="sel-ss" class="sel"></select></label>
      <span id="release" class="release" aria-live="polite"></span>
    </div>
  </header>
  <div class="shell">
    <nav id="sidebar" class="sidebar" aria-label="Điều hướng chính"></nav>
    <main id="main" class="main" tabindex="-1" aria-live="polite"></main>
  </div>
  <div id="drawer" class="drawer" hidden aria-hidden="true">
    <div id="drawer-backdrop" class="drawer-bg"></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button type="button" id="drawer-close" class="icon-btn close" aria-label="Đóng chi tiết">✕</button>
      <div id="drawer-body"></div>
    </aside>
  </div>
  <script src="js/mock-generator.js"></script>
  <script src="js/data-provider.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
